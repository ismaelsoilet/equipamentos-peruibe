<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Guia oficial e mapa de equipamentos públicos de Saúde e Educação de Peruíbe/SP." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Equipamentos Públicos – Peruíbe/SP</title>

  <style>
    /* ─────────────────────────────────────────────
       DESIGN SYSTEM & TOKENS
    ───────────────────────────────────────────── */
    :root {
      --primary:        #2563eb;
      --primary-dark:   #1d4ed8;
      --primary-light:  #eff6ff;
      --primary-subtle: #dbeafe;

      --saude-accent:   #ef4444;
      --saude-dark:     #dc2626;
      --saude-bg:       #fef2f2;
      --saude-border:   #fee2e2;
      --saude-chip:     #f87171;

      --edu-accent:     #0284c7;
      --edu-dark:       #0369a1;
      --edu-bg:         #f0f9ff;
      --edu-border:     #e0f2fe;
      --edu-chip:       #38bdf8;

      --bg:             #f8fafc;
      --surface:        #ffffff;
      --surface-glass:  rgba(255, 255, 255, 0.88);
      --surface-alt:    #f1f5f9;
      --text:           #0f172a;
      --text-muted:     #475569;
      --text-soft:      #64748b;
      --border:         #e2e8f0;
      --border-focus:   #3b82f6;

      --radius-xs:      6px;
      --radius-sm:      10px;
      --radius-md:      16px;
      --radius-lg:      22px;
      --radius-full:    9999px;

      --shadow-xs:      0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-sm:      0 2px 6px -1px rgba(15, 23, 42, 0.06), 0 1px 4px -1px rgba(15, 23, 42, 0.04);
      --shadow-md:      0 8px 20px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -2px rgba(15, 23, 42, 0.04);
      --shadow-lg:      0 14px 28px -4px rgba(15, 23, 42, 0.12), 0 6px 10px -3px rgba(15, 23, 42, 0.05);

      --nav-height:     62px;
      --safe-bottom:    env(safe-area-inset-bottom, 0px);
      --safe-top:       env(safe-area-inset-top, 0px);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      line-height: 1.5;
      padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 24px);
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    input {
      font-family: inherit;
      outline: none;
    }

    /* ─────────────────────────────────────────────
       HEADER HERO
    ───────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #091325 0%, #0f172a 50%, #1e293b 100%);
      color: #ffffff;
      padding: 24px 16px 20px;
      padding-top: calc(24px + var(--safe-top));
      text-align: center;
      position: relative;
      overflow: hidden;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header::before {
      content: "";
      position: absolute;
      top: -40px;
      right: -40px;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(2, 132, 199, 0.25) 0%, transparent 70%);
      pointer-events: none;
    }

    .header::after {
      content: "";
      position: absolute;
      bottom: -30px;
      left: -30px;
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 4px 12px;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
      backdrop-filter: blur(8px);
    }

    .header-title {
      font-size: clamp(1.35rem, 5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .header-desc {
      font-size: 0.88rem;
      color: #94a3b8;
      max-width: 480px;
      margin: 0 auto 14px;
    }

    .header-stats-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-full);
      padding: 6px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .stat-pill strong {
      color: #38bdf8;
    }
    .stat-pill.pill-saude strong {
      color: #f87171;
    }

    /* ─────────────────────────────────────────────
       DESKTOP TAB NAV (>= 640px)
    ───────────────────────────────────────────── */
    .desktop-nav {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-xs);
    }

    .desktop-nav-inner {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      padding: 0 16px;
    }

    .dtab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-soft);
      border-bottom: 3px solid transparent;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dtab:hover {
      color: var(--text);
      background: var(--surface-alt);
    }

    .dtab.active-todos {
      color: #0f172a;
      border-bottom-color: #0f172a;
    }
    .dtab.active-saude {
      color: var(--saude-dark);
      border-bottom-color: var(--saude-dark);
      background: var(--saude-bg);
    }
    .dtab.active-edu {
      color: var(--edu-dark);
      border-bottom-color: var(--edu-dark);
      background: var(--edu-bg);
    }

    .dtab-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: #e2e8f0;
      color: var(--text);
      font-weight: 800;
    }
    .dtab.active-todos .dtab-badge { background: #0f172a; color: #fff; }
    .dtab.active-saude .dtab-badge { background: var(--saude-accent); color: #fff; }
    .dtab.active-edu .dtab-badge   { background: var(--edu-accent); color: #fff; }

    /* ─────────────────────────────────────────────
       SELETOR RÁPIDO DE CATEGORIA (Saúde / Educação)
    ───────────────────────────────────────────── */
    .category-selector-wrap {
      display: none; /* Oculto no mobile porque a navegação já existe na barra inferior (bottom-nav) */
      max-width: 520px;
      margin: 0 auto;
      padding: 10px 16px 4px;
      width: 100%;
    }

    .category-segmented-bar {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: var(--radius-full);
      gap: 3px;
      position: relative;
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      width: 100%;
    }

    .cat-pill {
      flex: 1;
      min-width: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 6px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      background: transparent;
      min-height: 36px;
      user-select: none;
    }

    .cat-pill:hover:not([class*="active-"]) {
      color: var(--text);
      background: rgba(255, 255, 255, 0.6);
    }

    .cat-pill:active {
      transform: scale(0.97);
    }

    .cat-pill-icon {
      font-size: 0.95rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .cat-pill-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cat-pill-count {
      font-size: 0.68rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.08);
      color: var(--text-soft);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .cat-pill.active-todos {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.2);
    }
    .cat-pill.active-todos .cat-pill-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .cat-pill.active-saude {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
    }
    .cat-pill.active-saude .cat-pill-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .cat-pill.active-edu {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
    }
    .cat-pill.active-edu .cat-pill-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* ── STICKY TOOLBAR (Search & Controls) ─────────────── */
    .sticky-toolbar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-xs);
    }

    .search-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-box {
      flex: 1;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: all 0.2s ease;
      min-height: 42px;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-icon {
      padding-left: 12px;
      font-size: 0.95rem;
      color: var(--text-soft);
      pointer-events: none;
      display: flex;
      align-items: center;
    }

    .search-input {
      width: 100%;
      padding: 10px 32px 10px 8px;
      font-size: 0.94rem;
      border: none;
      background: transparent;
      color: var(--text);
    }

    .search-input::placeholder {
      color: #94a3b8;
    }

    .search-clear-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border-radius: var(--radius-full);
      background: #e2e8f0;
      color: #475569;
      font-size: 0.75rem;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .search-clear-btn:hover {
      background: #cbd5e1;
      color: #0f172a;
    }

    .search-input:not(:placeholder-shown) ~ .search-clear-btn {
      display: flex;
    }

    /* Botão Perto de Mim Adaptável */
    .btn-near-me {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0 12px;
      height: 42px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      flex-shrink: 0;
    }

    .btn-near-me:hover {
      background: var(--surface-alt);
      color: var(--text);
      border-color: #cbd5e1;
    }

    .btn-near-me:active {
      transform: scale(0.96);
    }

    .btn-near-me.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.25);
    }

    .near-me-label-full {
      display: inline;
    }
    .near-me-label-short {
      display: none;
    }

    @media (max-width: 480px) {
      .near-me-label-full { display: none; }
      .near-me-label-short { display: inline; }
      .btn-near-me { padding: 0 10px; }
    }

    /* Painel do Seletor de Raio Estruturado */
    .radius-panel {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      border: 1px solid #bfdbfe;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.08);
      animation: fadeInSlide 0.2s ease-out;
    }

    .radius-panel.hidden {
      display: none;
    }

    .radius-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .radius-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1e3a8a;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-close-radius {
      width: 22px;
      height: 22px;
      border-radius: var(--radius-full);
      background: rgba(30, 58, 138, 0.1);
      color: #1e3a8a;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .btn-close-radius:hover {
      background: rgba(30, 58, 138, 0.2);
    }

    .radius-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      width: 100%;
    }

    .rchip {
      padding: 5px 0;
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      font-weight: 700;
      border: 1px solid #93c5fd;
      background: #ffffff;
      color: #1e40af;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .rchip:hover {
      background: #dbeafe;
    }

    .rchip.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
    }

    /* ── QUICK FILTERS CARROSSEL (Limpo, sem setas cobrindo texto) ── */
    .quickfilters-outer {
      position: relative;
      max-width: 1080px;
      margin: 0 auto;
      overflow: hidden;
    }

    .quickfilters-outer::before,
    .quickfilters-outer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 18px;
      z-index: 2;
      pointer-events: none;
    }

    .quickfilters-outer::before {
      left: 0;
      background: linear-gradient(to right, rgba(248, 250, 252, 0.95), transparent);
    }

    .quickfilters-outer::after {
      right: 0;
      background: linear-gradient(to left, rgba(248, 250, 252, 0.95), transparent);
    }

    .quickfilters-scroll {
      display: flex;
      gap: 6px;
      padding: 4px 12px 10px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }

    .quickfilters-scroll::-webkit-scrollbar {
      display: none;
    }

    .qchip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      scroll-snap-align: start;
      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 36px;
      user-select: none;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }

    .qchip:hover {
      border-color: #cbd5e1;
      background: var(--surface-alt);
      color: var(--text);
    }

    .qchip:active {
      transform: scale(0.96);
    }

    .qchip-count {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: #e2e8f0;
      color: var(--text-soft);
      transition: all 0.18s;
    }

    .qchip.active-all {
      background: #0f172a;
      border-color: #0f172a;
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.2);
    }
    .qchip.active-all .qchip-count {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .qchip.active-saude {
      background: var(--saude-dark);
      border-color: var(--saude-dark);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(239, 68, 68, 0.25);
    }
    .qchip.active-saude .qchip-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    .qchip.active-edu {
      background: var(--edu-dark);
      border-color: var(--edu-dark);
      color: #ffffff;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.25);
    }
    .qchip.active-edu .qchip-count {
      background: rgba(255, 255, 255, 0.25);
      color: #ffffff;
    }

    /* Tag de Distância no Card */
    .card-distance {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.72rem;
      font-weight: 800;
      color: #047857;
      background: #d1fae5;
      border: 1px solid #a7f3d0;
      padding: 1px 7px;
      border-radius: var(--radius-full);
      letter-spacing: 0.2px;
    }

    /* ─────────────────────────────────────────────
       RESULTS STATUS BAR
    ───────────────────────────────────────────── */
    .results-bar {
      max-width: 1080px;
      margin: 14px auto 6px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .results-count {
      font-size: 0.86rem;
      color: var(--text-soft);
      font-weight: 500;
    }
    .results-count strong {
      color: var(--text);
    }

    .btn-reset-filters {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: var(--primary-light);
      border: 1px solid var(--primary-subtle);
      transition: all 0.15s;
    }
    .btn-reset-filters:hover {
      background: #dbeafe;
    }
    .btn-reset-filters.hidden {
      display: none;
    }

    /* ─────────────────────────────────────────────
       CARDS GRID
    ───────────────────────────────────────────── */
    .grid {
      max-width: 1080px;
      margin: 10px auto 20px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr));
      gap: 16px;
    }

    /* ─────────────────────────────────────────────
       CARD COMPONENT
    ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s;
      position: relative;
    }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-3px);
        box-shadow: var(--shadow-md);
      }
      .card.cat-saude:hover {
        border-color: rgba(239, 68, 68, 0.4);
      }
      .card.cat-edu:hover {
        border-color: rgba(2, 132, 199, 0.4);
      }
    }

    /* Faixa de cor superior refinada */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }
    .card.cat-saude::before {
      background: linear-gradient(90deg, #ef4444, #f87171);
    }
    .card.cat-edu::before {
      background: linear-gradient(90deg, #0284c7, #38bdf8);
    }

    .card-header {
      padding: 18px 16px 10px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .card-icon-box {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;

      padding: 2px 8px;

    .cat-saude .card-badge {

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.35;
      letter-spacing: -0.015em;
    }

    .card-body {
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .info-icon {
      flex-shrink: 0;
      font-size: 0.95rem;
      opacity: 0.75;
      margin-top: 1px;

    .info-content {

    .address-wrapper {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-copy {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: var(--radius-xs);
      background: var(--surface-alt);
      color: var(--text-soft);
      border: 1px solid var(--border);
      transition: all 0.15s;

      background: #e2e8f0;
      color: var(--text);

    .btn-copy.copied {
      background: #dcfce7;
      color: #15803d;
      border-color: #bbf7d0;

    .contact-link {
      color: var(--primary);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;

    .card-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);

      gap: 8px;
      width: 100%;

      font-weight: 700;
      color: #ffffff;

      min-height: 48px;

      transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);

    .cat-saude .btn-maps {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);

    .cat-saude .btn-maps:hover {

      justify-content: center;

      font-weight: 600;
      min-height: var(--nav-height);
      position: relative;
      transition: color 0.15s;

    .nav-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: transparent;
      transition: background 0.2s;
    }

    .nav-icon {
      font-size: 1.35rem;
      line-height: 1;
    }

    .nav-count-badge {

      top: 6px;
      right: calc(50% - 18px);

      font-weight: 800;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: #64748b;
      color: #ffffff;
      min-width: 18px;
      text-align: center;

      color: var(--edu-dark);
    }
    .nav-btn.active-edu::before { background: var(--edu-dark); }
    .nav-btn.active-edu .nav-count-badge { background: var(--edu-dark); }

    ───────────────────────────────────────────── */

      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      text-align: center;
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px dashed var(--border);
      margin: 10px 0;
    }

    .empty-icon {
      font-size: 3rem;
      margin-bottom: 4px;
    }

    .empty-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .empty-desc {
      font-size: 0.88rem;
      color: var(--text-soft);
      max-width: 320px;
    }

    /* ─────────────────────────────────────────────
       TOAST NOTIFICATION
    ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + var(--safe-bottom) + 16px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-full);
      font-size: 0.84rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow-lg);
      z-index: 300;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ─────────────────────────────────────────────
       RESPONSIVE ADAPTATIONS
    ───────────────────────────────────────────── */
    @media (min-width: 640px) {
      body {

      .category-selector-wrap {
        display: block;
      }
      .desktop-nav {
        display: none !important;
      }
      .sticky-toolbar {
        top: 0;
      }
      .toast {
        bottom: 24px;
      }
    }

/* ── COPIAR ENDEREÇO COM TOAST ────────────────────── */
function copyToClipboard(text, btnElement) {
  if (!navigator.clipboard) {
    fallbackCopy(text);
  } else {
    navigator.clipboard.writeText(text).then(() => {
      triggerCopyFeedback(btnElement);
    }).catch(() => {
      fallbackCopy(text);
    });
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    triggerCopyFeedback();
  } catch (err) {}
  document.body.removeChild(ta);
}

function triggerCopyFeedback(btn) {
  if (btn) {
    btn.classList.add('copied');
    btn.innerHTML = '✓ Copiado';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '📋 Copiar';
    }, 2000);
  }
  showToast('Endereço copiado para a área de transferência!');
}

function showToast(msg) {
  const t = $('toast');
  $('toast-msg').textContent = msg;
  t.classList.add('show');
  setTimeout(() => {
    t.classList.remove('show');
  }, 2200);
}

/* ── GEOLOCALIZAÇÃO & HAVERSINE (Perto de Mim) ─────── */
function haversineDistanceKm(lat1, lon1, lat2, lon2) {
  const R = 6371; // Raio da Terra em km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function formatDistance(distKm) {
  if (distKm === undefined || distKm === null) return '';
  if (distKm < 1) {
    return `${Math.round(distKm * 1000)} m`;
  }
  return `${distKm.toFixed(1).replace('.', ',')} km`;
}

  }

function enableNearMe() {
  if (!navigator.geolocation) {
    showToast('Geolocalização não é suportada pelo seu navegador.');
    return;
  }

  const btn = $('btn-near-me');
  const txt = $('near-me-text');
  btn.classList.add('loading');
  txt.textContent = 'Obtendo GPS...';

  navigator.geolocation.getCurrentPosition(
    position => {
      btn.classList.remove('loading');
      btn.classList.add('active');
      txt.textContent = 'Perto de mim';

      userLocation = {
        lat: position.coords.latitude,
        lon: position.coords.longitude
      };

      $('radius-panel').classList.remove('hidden');
      showToast('Localização obtida! Exibindo unidades próximas.');
      render();
    },
    error => {
      btn.classList.remove('loading');
      txt.textContent = 'Perto de mim';
      let msg = 'Não foi possível obter sua localização.';
      if (error.code === error.PERMISSION_DENIED) {
        msg = 'Permissão de localização negada. Ative o GPS para usar.';
      }
      showToast(msg);
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 60000
    }
  );
}

}

/* ── FILTRAGEM & DADOS ────────────────────────────── */
function getFilteredItems() {
  // 1. Filtrar categorias, tipos e busca textual
  let items = DATA.filter(item => {
    if (activeTab !== 'todos' && item.categoria !== activeTab) return false;
    if (activeFilter && item.tipo !== activeFilter) return false;
    if (searchQuery) {
      const haystack = [item.nome, item.tipo, item.endereco, item.id].filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(searchQuery)) return false;
    }
    return true;
  });

  // 2. Se modo Perto de Mim estiver ativo, calcular distâncias e aplicar filtro de raio
  if (userLocation) {
    items = items.map(item => {
      if (item.lat && item.lon) {
        const dist = haversineDistanceKm(userLocation.lat, userLocation.lon, item.lat, item.lon);
        return { ...item, distance: dist };
      }
      return { ...item, distance: Infinity };
    });

    // Filtrar por raio máximo se configurado
    if (selectedRadius !== null) {
      items = items.filter(item => item.distance <= selectedRadius);
    }

    // Ordenar pelo mais próximo primeiro
    items.sort((a, b) => a.distance - b.distance);
  } else {
    // Ordenação padrão alfabética
    items.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  }

  return items;
}

/* ── CENTRALIZAÇÃO DOS QUICKFILTERS ─────────────────── */
function centerChip(chip) {
  if (!chip) return;
  const wrap = $('filter-chips');
  if (!wrap) return;

  const chipRect = chip.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const currentScroll = wrap.scrollLeft;
  const targetScroll = currentScroll + (chipRect.left - wrapRect.left) - (wrapRect.width / 2) + (chipRect.width / 2);

  wrap.scrollTo({
    left: Math.max(0, targetScroll),
    behavior: 'smooth'
  });
}

  $('near-me-text').textContent = 'Perto de mim';
  $('radius-panel').classList.add('hidden');
  showToast('Modo perto de mim desativado.');
  render();
}

function setRadius(km) {
  selectedRadius = km;
  // Atualizar visual dos chips de raio
  [1, 3, 5, 10, 'all'].forEach(val => {
    const chip = $(`rchip-${val}`);
    if (chip) {
      const isAct = (val === 'all' && km === null) || (val === km);
      chip.className = `rchip ${isAct ? 'active' : ''}`.trim();
      chip.setAttribute('aria-checked', isAct);
    }
  });

  const label = km ? `${km} km` : 'sem limite';
  showToast(`Raio configurado para ${label}.`);
  render();
}

/* ── FILTRAGEM & DADOS ────────────────────────────── */
function getFilteredItems() {
  // 1. Filtrar categorias, tipos e busca textual
  let items = DATA.filter(item => {
    if (activeTab !== 'todos' && item.categoria !== activeTab) return false;
    if (activeFilter && item.tipo !== activeFilter) return false;
    if (searchQuery) {
      const haystack = [item.nome, item.tipo, item.endereco, item.id].filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(searchQuery)) return false;
    }
    return true;
  });

  // 2. Se modo Perto de Mim estiver ativo, calcular distâncias e aplicar filtro de raio
  if (userLocation) {
    items = items.map(item => {
      if (item.lat && item.lon) {
        const dist = haversineDistanceKm(userLocation.lat, userLocation.lon, item.lat, item.lon);
        return { ...item, distance: dist };
      }
      return { ...item, distance: Infinity };
    });

    // Filtrar por raio máximo se configurado
    if (selectedRadius !== null) {
      items = items.filter(item => item.distance <= selectedRadius);
    }

    // Ordenar pelo mais próximo primeiro
    items.sort((a, b) => a.distance - b.distance);
  } else {
    // Ordenação padrão alfabética
    items.sort((a, b) => (a.nome || '').localeCompare(b.nome || '', 'pt-BR'));
  }

  return items;
}

/* ── TROCA DE TAB ─────────────────────────────────── */
function setTab(tab) {
  activeTab = tab;
  activeFilter = null; // Reseta filtro de tipo ao mudar de categoria

  // Atualizar Bottom Nav (mobile)
  ['all', 'saude', 'edu'].forEach(k => {
    const map = { all: 'todos', saude: 'saude', edu: 'educacao' };
    const isAct = map[k] === tab;
    const btn = $(`nav-${k}`);
    btn.className = `nav-btn ${isAct ? 'active-' + (k === 'all' ? 'todos' : k) : ''}`.trim();
    btn.setAttribute('aria-selected', isAct);
  });

  // Atualizar Desktop Nav
  ['all', 'saude', 'edu'].forEach(k => {
    const map = { all: 'todos', saude: 'saude', edu: 'educacao' };
    const isAct = map[k] === tab;
    const btn = $(`dtab-${k}`);
    btn.className = `dtab ${isAct ? 'active-' + (k === 'all' ? 'todos' : k) : ''}`.trim();
    btn.setAttribute('aria-selected', isAct);
  });

  // Atualizar Seletor Rápido (Pills)
  ['all', 'saude', 'edu'].forEach(k => {
    const map = { all: 'todos', saude: 'saude', edu: 'educacao' };
    const isAct = map[k] === tab;
    const pill = $(`cat-pill-${k}`);
    if (pill) {
      pill.className = `cat-pill ${isAct ? 'active-' + (k === 'all' ? 'todos' : k) : ''}`.trim();
      pill.setAttribute('aria-selected', isAct);
    }
  });

  buildQuickFilters();
  render();
}

/* ── SEARCH ACTIONS ───────────────────────────────── */
function onSearch() {
  searchQuery = $('search').value.toLowerCase().trim();
  render();
}

function clearSearch() {
  $('search').value = '';
  searchQuery = '';
  render();
  $('search').focus();
}

function clearAllFilters() {
  activeFilter = null;
  searchQuery = '';
  $('search').value = '';
  buildQuickFilters();
  render();
}

/* ── CENTRALIZAÇÃO DOS QUICKFILTERS ─────────────────── */
function centerChip(chip) {
  if (!chip) return;
  const wrap = $('filter-chips');
  if (!wrap) return;

  const chipRect = chip.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  const currentScroll = wrap.scrollLeft;
  const targetScroll = currentScroll + (chipRect.left - wrapRect.left) - (wrapRect.width / 2) + (chipRect.width / 2);

  wrap.scrollTo({
    left: Math.max(0, targetScroll),
    behavior: 'smooth'
  });
}

/* ── QUICKFILTERS (Com contagem e centralização) ──── */
function buildQuickFilters() {
  const pool = DATA.filter(item => activeTab === 'todos' || item.categoria === activeTab);
  const wrap = $('filter-chips');
  wrap.innerHTML = '';

  // 1. Chip inicial "Todos"
  const allChip = document.createElement('button');
  const isAllActive = activeFilter === null;
  let allChipClass = 'qchip';
  if (isAllActive) {
    allChipClass += activeTab === 'saude' ? ' active-saude' : (activeTab === 'educacao' ? ' active-edu' : ' active-all');
  }
  allChip.className = allChipClass;
  allChip.setAttribute('aria-pressed', isAllActive);
  allChip.innerHTML = `<span>✨ Todos</span><span class="qchip-count">${pool.length}</span>`;
  allChip.onclick = () => {
    activeFilter = null;
    buildQuickFilters();
    render();
    setTimeout(() => {
      centerChip(wrap.firstElementChild);
    }, 10);
  };
  wrap.appendChild(allChip);

  // 2. Contar frequência de cada tipo
  const counts = {};
  pool.forEach(item => {
    if (item.tipo) {
      counts[item.tipo] = (counts[item.tipo] || 0) + 1;
    }
  });

  const sortedTipos = Object.keys(counts).sort((a, b) => b - a || a.localeCompare(b, 'pt-BR'));

  sortedTipos.forEach(tipo => {
    const isSelected = activeFilter === tipo;
    const sampleItem = pool.find(e => e.tipo === tipo);
    const cat = sampleItem ? sampleItem.categoria : 'saude';

    let chipCls = 'qchip';
    if (isSelected) {
      chipCls += cat === 'saude' ? ' active-saude' : ' active-edu';
    }

    const btn = document.createElement('button');
    btn.className = chipCls;
    btn.setAttribute('aria-pressed', isSelected);
    btn.innerHTML = `<span>${getIcon(tipo)} ${escapeHtml(tipo)}</span><span class="qchip-count">${counts[tipo]}</span>`;
    
    btn.onclick = () => {
      activeFilter = activeFilter === tipo ? null : tipo;
      buildQuickFilters();
      render();

      // Centralizar exatamente no container horizontal
      setTimeout(() => {
        const activeBtn = wrap.querySelector('.qchip.active-saude, .qchip.active-edu');
        if (activeBtn) {
          centerChip(activeBtn);
        } else {
          centerChip(wrap.firstElementChild);
        }
      }, 10);
    };

    wrap.appendChild(btn);
  });
}

/* ── RENDERIZAÇÃO DOS CARDS ───────────────────────── */
function render() {
  const items = getFilteredItems();
  const total = items.length;
  const grid = $('grid');

  // Atualizar contadores do cabeçalho e abas
  const nSaude = DATA.filter(e => e.categoria === 'saude').length;
  const nEdu = DATA.filter(e => e.categoria === 'educacao').length;

  $('header-saude-count').textContent = nSaude;
  $('header-edu-count').textContent = nEdu;
  $('header-total-count').textContent = DATA.length;

  $('nc-all').textContent = DATA.length;
  $('nc-saude').textContent = nSaude;
  $('nc-edu').textContent = nEdu;

  $('dc-all').textContent = DATA.length;
  $('dc-saude').textContent = nSaude;
  $('dc-edu').textContent = nEdu;

  if ($('pill-count-all')) $('pill-count-all').textContent = DATA.length;
  if ($('pill-count-saude')) $('pill-count-saude').textContent = nSaude;
  if ($('pill-count-edu')) $('pill-count-edu').textContent = nEdu;

  // Barra de status de resultados
  const hasActiveFilters = activeFilter !== null || searchQuery !== '';
  $('reset-filters-btn').className = `btn-reset-filters ${hasActiveFilters ? '' : 'hidden'}`;

  let filterLabel = '';
  if (activeFilter) {
    filterLabel += ` em <strong>${escapeHtml(activeFilter)}</strong>`;
  }
  if (searchQuery) {
    filterLabel += ` com termo "<strong>${escapeHtml(searchQuery)}</strong>"`;
  }
  if (userLocation) {
    const rTxt = selectedRadius !== null ? ` a até <strong>${selectedRadius} km</strong> de você` : ' ordenados por proximidade';
    filterLabel += rTxt;
  }

  $('results-count').innerHTML = `Exibindo <strong>${total}</strong> de ${DATA.length} equipamentos${filterLabel}`;

  // Estado Vazio
  if (total === 0) {
    grid.innerHTML = `
      <div class="empty-state" role="status">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">Nenhum equipamento encontrado</div>
        <p class="empty-desc">Não localizamos nenhum resultado para o filtro ou busca informada. Tente outros termos ou limpe os filtros.</p>
        <button class="btn-reset-filters" style="margin-top:10px" onclick="clearAllFilters()">
          ✕ Limpar todos os filtros
        </button>
      </div>`;
    return;
  }

  // Fragment de montagem de alta performance
  const fragment = document.createDocumentFragment();

  items.forEach(item => {
    const isSaude = item.categoria === 'saude';
    const catClass = isSaude ? 'cat-saude' : 'cat-edu';
    const tels = [item.tel1, item.tel2].filter(Boolean);
    const emails = [item.email1, item.email2].filter(Boolean);

    let infoHtml = '';

    // Endereço com botão Copiar
    if (item.endereco) {
      infoHtml += `
        <div class="info-row">
          <span class="info-icon" aria-hidden="true">📍</span>
          <div class="info-content address-wrapper">
            <span>${escapeHtml(item.endereco)}</span>
            <button class="btn-copy" onclick="copyToClipboard('${escapeHtml(item.endereco)}', this)" aria-label="Copiar endereço">
              📋 Copiar
            </button>
          </div>
        </div>`;
    }

    // Telefones
    if (tels.length > 0) {
      const telLinks = tels.map(t => {
        const clean = cleanDigits(t);
        return `<a class="contact-link" href="tel:${clean}" aria-label="Ligar para ${escapeHtml(t)}">📞 ${escapeHtml(t)}</a>`;
      }).join(' &nbsp;·&nbsp; ');

      infoHtml += `
        <div class="info-row">
          <span class="info-icon" aria-hidden="true">☎️</span>
          <div class="info-content">${telLinks}</div>
        </div>`;
    }

    // E-mails
    if (emails.length > 0) {
      const mailLinks = emails.map(m => `
        <a class="contact-link" href="mailto:${escapeHtml(m)}" aria-label="Enviar e-mail para ${escapeHtml(m)}">
          ✉️ ${escapeHtml(m)}
        </a>
      `).join('<br>');

      infoHtml += `
        <div class="info-row">
          <span class="info-icon" aria-hidden="true">📧</span>
          <div class="info-content">${mailLinks}</div>
        </div>`;
    }

    const card = document.createElement('article');
    card.className = `card ${catClass}`;
    card.setAttribute('aria-label', item.nome || 'Equipamento Público');
    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon-box" aria-hidden="true">${getIcon(item.tipo)}</div>
        <div class="card-title-group">
          <div class="card-meta-row">
            <span class="card-badge">${escapeHtml(item.tipo || '')}</span>
            <div style="display:flex;align-items:center;gap:6px">
              ${item.distance !== undefined && item.distance !== Infinity ? `<span class="card-distance" title="Distância em linha reta">📍 ${formatDistance(item.distance)}</span>` : ''}
              <span class="card-id">#${escapeHtml(item.id || '')}</span>
            </div>
          </div>
          <h2 class="card-title">${escapeHtml(item.nome || 'Sem nome')}</h2>
        </div>
      </div>

      <div class="card-body">
        ${infoHtml || '<div class="info-row" style="color:var(--text-soft)">Sem dados adicionais</div>'}
      </div>

      <div class="card-footer">
        <a class="btn-maps"
           href="${getMapsUrl(item)}"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Abrir rota no Google Maps para ${escapeHtml(item.nome)}">
          <span class="btn-maps-icon" aria-hidden="true">🗺️</span>
          Ir até lá – Google Maps
        </a>
      </div>`;

    fragment.appendChild(card);
  });

  grid.innerHTML = '';
  grid.appendChild(fragment);
}

/* ── INICIALIZAÇÃO ─────────────────────────────────── */
buildQuickFilters();
render();

</script>
</body>
</html>
