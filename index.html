<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a2744" />
  <meta name="description" content="Lista de equipamentos públicos de Saúde e Educação do município de Peruíbe/SP com localização no Google Maps." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Equipamentos Públicos – Peruíbe/SP</title>

  <style>
    /* ─────────────────────────────────────────────
       DESIGN TOKENS
    ───────────────────────────────────────────── */
    :root {
      --red:        #e53935;
      --red-dark:   #b71c1c;
      --red-light:  #fdecea;
      --red-mid:    #ffcdd2;

      --blue:       #1565c0;
      --blue-dark:  #0d47a1;
      --blue-light: #e3f2fd;
      --blue-mid:   #bbdefb;

      --bg:         #f0f4f8;
      --surface:    #ffffff;
      --surface2:   #f8fafc;
      --text:       #1a2744;
      --text2:      #4a5568;
      --muted:      #718096;
      --border:     #e2e8f0;
      --divider:    #edf2f7;

      --radius-sm:  8px;
      --radius-md:  14px;
      --radius-lg:  20px;
      --shadow-sm:  0 1px 4px rgba(0,0,0,0.08);
      --shadow-md:  0 4px 16px rgba(0,0,0,0.10);
      --shadow-lg:  0 8px 32px rgba(0,0,0,0.14);

      --nav-h:      60px;   /* sticky nav height */
      --safe-bot:   env(safe-area-inset-bottom, 0px);
    }

    /* ─────────────────────────────────────────────
       RESET & BASE
    ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      /* push content above bottom nav on mobile */
      padding-bottom: calc(var(--nav-h) + var(--safe-bot) + 16px);
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input  { font-family: inherit; }

    /* ─────────────────────────────────────────────
       TOP HEADER
    ───────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #1a2744 0%, #1565c0 100%);
      color: #fff;
      padding: 20px 16px 18px;
      padding-top: calc(20px + env(safe-area-inset-top, 0px));
      text-align: center;
    }
    .header-title {
      font-size: clamp(1.1rem, 4vw, 1.5rem);
      font-weight: 800;
      letter-spacing: -.3px;
      line-height: 1.2;
    }
    .header-sub {
      font-size: .82rem;
      opacity: .72;
      margin-top: 4px;
      font-weight: 400;
    }
    .header-stats {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 14px;
    }
    .stat-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: .78rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
    }

    /* ─────────────────────────────────────────────
       SEARCH BAR (sticky below header)
    ───────────────────────────────────────────── */
    .search-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      background: var(--surface);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    .search-inner {
      max-width: 700px;
      margin: 0 auto;
      position: relative;
    }
    .search-icon-el {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
      color: var(--muted);
    }
    .search-input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-lg);
      font-size: 1rem;      /* prevent iOS zoom (≥16px visually) */
      background: var(--surface2);
      color: var(--text);
      outline: none;
      transition: border-color .18s, box-shadow .18s;
      -webkit-appearance: none;
    }
    .search-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(21,101,192,.15);
      background: var(--surface);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--muted);
      color: #fff;
      font-size: .75rem;
      line-height: 24px;
      text-align: center;
      display: none;
      cursor: pointer;
    }
    .search-input:not(:placeholder-shown) ~ .search-clear { display: block; }

    /* ─────────────────────────────────────────────
       FILTER CHIPS (horizontal scroll)
    ───────────────────────────────────────────── */
    .filters-wrap {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .filters-scroll {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      max-width: 900px;
      margin: 0 auto;
    }
    .filters-scroll::-webkit-scrollbar { display: none; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text2);
      font-size: .82rem;
      font-weight: 600;
      white-space: nowrap;
      scroll-snap-align: start;
      transition: all .15s;
      -webkit-tap-highlight-color: transparent;
      min-height: 36px;  /* comfortable tap target */
    }
    .chip:active { transform: scale(.96); }
    .chip.chip-saude.active  { background: var(--red-light);  border-color: var(--red);  color: var(--red-dark); }
    .chip.chip-edu.active    { background: var(--blue-light); border-color: var(--blue); color: var(--blue-dark); }
    .chip.chip-all.active    { background: #1a2744; border-color: #1a2744; color: #fff; }

    /* ─────────────────────────────────────────────
       RESULTS INFO
    ───────────────────────────────────────────── */
    .results-bar {
      max-width: 900px;
      margin: 14px auto 0;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .results-count {
      font-size: .82rem;
      color: var(--muted);
      font-weight: 500;
    }
    .clear-btn {
      font-size: .78rem;
      color: var(--blue);
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--blue-mid);
      background: var(--blue-light);
      display: none;
    }
    .clear-btn.visible { display: inline-block; }

    /* ─────────────────────────────────────────────
       CARD GRID
    ───────────────────────────────────────────── */
    .grid {
      max-width: 900px;
      margin: 12px auto 8px;
      padding: 0 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    /* ─────────────────────────────────────────────
       CARD
    ───────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border-top: 4px solid transparent;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow .2s, transform .2s;
      -webkit-tap-highlight-color: transparent;
    }
    @media (hover: hover) {
      .card:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-2px);
      }
    }
    .card.cat-saude { border-top-color: var(--red); }
    .card.cat-edu   { border-top-color: var(--blue); }

    /* Card Header */
    .card-head {
      padding: 14px 16px 8px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .card-icon-box {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .cat-saude .card-icon-box { background: var(--red-mid); }
    .cat-edu   .card-icon-box { background: var(--blue-mid); }

    .card-title-wrap { flex: 1; min-width: 0; }
    .card-name {
      font-size: .97rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      word-break: break-word;
    }
    .card-badge {
      display: inline-block;
      margin-top: 5px;
      font-size: .68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .cat-saude .card-badge { background: var(--red-mid);  color: var(--red-dark); }
    .cat-edu   .card-badge { background: var(--blue-mid); color: var(--blue-dark); }

    /* Card Body */
    .card-body {
      padding: 0 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      flex: 1;
    }
    .info-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: .87rem;
      line-height: 1.45;
      color: var(--text2);
    }
    .info-icon { flex-shrink: 0; width: 18px; text-align: center; opacity: .6; font-size: .9rem; margin-top: 1px; }
    .info-text { word-break: break-word; }
    .info-text a { color: var(--blue); }
    .info-text a:active { opacity: .7; }

    /* Card Footer */
    .card-foot {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--divider);
    }
    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 16px;
      border-radius: var(--radius-sm);
      font-size: .93rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: .1px;
      transition: filter .15s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      min-height: 48px; /* WCAG tap target */
    }
    .btn-maps:active { filter: brightness(.88); transform: scale(.98); }
    .cat-saude .btn-maps { background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%); }
    .cat-edu   .btn-maps { background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 100%); }
    .btn-maps-icon { font-size: 1.1rem; }

    /* ─────────────────────────────────────────────
       BOTTOM NAV (mobile tab bar)
    ───────────────────────────────────────────── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 200;
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -4px 16px rgba(0,0,0,0.10);
      display: flex;
      padding-bottom: var(--safe-bot);
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      padding: 10px 8px;
      color: var(--muted);
      font-size: .7rem;
      font-weight: 600;
      min-height: var(--nav-h);
      transition: color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .nav-btn::before {
      content: '';
      position: absolute;
      top: 0; left: 16%; right: 16%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background: transparent;
      transition: background .15s;
    }
    .nav-btn .nav-icon { font-size: 1.4rem; line-height: 1; }
    .nav-btn .nav-count {
      position: absolute;
      top: 6px; right: calc(50% - 16px);
      background: var(--red);
      color: #fff;
      font-size: .6rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 10px;
      min-width: 18px;
      text-align: center;
      line-height: 1.4;
    }

    .nav-btn.active-todos {
      color: #1a2744;
    }
    .nav-btn.active-todos::before { background: #1a2744; }

    .nav-btn.active-saude {
      color: var(--red);
    }
    .nav-btn.active-saude::before { background: var(--red); }
    .nav-btn.active-saude .nav-count { background: var(--red); }

    .nav-btn.active-edu {
      color: var(--blue);
    }
    .nav-btn.active-edu::before { background: var(--blue); }

    /* ─────────────────────────────────────────────
       EMPTY STATE
    ───────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--muted);
      text-align: center;
    }
    .empty-emoji { font-size: 3.5rem; }
    .empty-title { font-size: 1.05rem; font-weight: 700; color: var(--text2); }
    .empty-sub   { font-size: .88rem; max-width: 280px; }

    /* ─────────────────────────────────────────────
       SKELETON LOADER (optional polish)
    ───────────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    /* ─────────────────────────────────────────────
       RESPONSIVE — Desktop upgrades
    ───────────────────────────────────────────── */
    @media (min-width: 640px) {
      body { padding-bottom: 24px; }

      /* hide bottom nav on desktop, show top tab bar instead */
      .bottom-nav { display: none; }
      .desktop-tabs {
        display: flex !important;
        justify-content: center;
        background: var(--surface);
        border-bottom: 2px solid var(--border);
        box-shadow: var(--shadow-sm);
      }

      .search-bar { top: 52px; } /* below desktop tab bar */
    }

    @media (max-width: 639px) {
      .desktop-tabs { display: none !important; }
      .grid { grid-template-columns: 1fr; padding: 0 10px; }
    }

    /* Desktop Tab Bar */
    .desktop-tabs {
      display: none;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .dtab {
      padding: 14px 28px;
      font-size: .95rem;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 3px solid transparent;
      transition: all .18s;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }
    .dtab:hover { background: var(--surface2); }
    .dtab.active-todos { color: #1a2744; border-bottom-color: #1a2744; }
    .dtab.active-saude { color: var(--red);  border-bottom-color: var(--red);  background: var(--red-light); }
    .dtab.active-edu   { color: var(--blue); border-bottom-color: var(--blue); background: var(--blue-light); }
    .dtab-count {
      background: currentColor;
      color: #fff;
      font-size: .65rem;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 10px;
      opacity: .85;
    }

    /* ─────────────────────────────────────────────
       UTILITY
    ───────────────────────────────────────────── */
    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</head>

<!-- ══════════════════════════════════════════

══════════════════════════════════════════ -->
<div class="search-bar" role="search">
  <div class="search-inner">
    <span class="search-icon-el" aria-hidden="true">🔍</span>
    <input
      class="search-input"
      id="search"
      type="search"
      inputmode="search"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Buscar por nome, bairro, tipo…"
      aria-label="Buscar equipamentos"
      oninput="onSearch()"

<!-- ══════════════════════════════════════════
     FILTER CHIPS
══════════════════════════════════════════ -->
<div class="filters-wrap" role="group" aria-label="Filtrar por tipo">
  <div class="filters-scroll" id="filter-chips"></div>
</div>

<!-- ══════════════════════════════════════════
     RESULTS INFO
══════════════════════════════════════════ -->
<div class="results-bar">
  <span class="results-count" id="results-count" aria-live="polite">79 equipamentos</span>
  <button class="clear-btn" id="clear-all-btn" onclick="clearAll()">Limpar filtros</button>
</div>

<!-- ══════════════════════════════════════════
     CARDS GRID
══════════════════════════════════════════ -->
<main class="grid" id="grid" role="main" aria-label="Lista de equipamentos"></main>

<!-- ══════════════════════════════════════════
     BOTTOM NAV (mobile, ≤639 px)
══════════════════════════════════════════ -->
<nav class="bottom-nav" role="tablist" aria-label="Categoria">
  <button class="nav-btn active-todos" id="nav-all"   onclick="setTab('todos')"    role="tab" aria-selected="true">
    <span class="nav-icon">📋</span>
    <span>Todos</span>
    <span class="nav-count" id="nc-all">79</span>
  </button>
  <button class="nav-btn" id="nav-saude" onclick="setTab('saude')"   role="tab" aria-selected="false">
    <span class="nav-icon">🏥</span>
    <span>Saúde</span>
    <span class="nav-count" id="nc-saude">38</span>
  </button>
  <button class="nav-btn" id="nav-edu"   onclick="setTab('educacao')" role="tab" aria-selected="false">
    <span class="nav-icon">🏫</span>
    <span>Educação</span>
    <span class="nav-count" id="nc-edu">41</span>
  </button>
</nav>

/* ── ICON MAP ─────────────────────────────────────── */
const ICONS = {
  EMEI:'🎒', EMEF:'📚', EMEIF:'📖', Outro:'📋',
  USAFA:'🏥', Hospital:'🏨', Emergência:'🚨', Odontologia:'🦷',
  Especialidades:'🩺', 'Saúde Mental':'🧠', Laboratório:'🧪',
  Vigilância:'🔬', Prevenção:'🏃', Reabilitação:'♿',
  Farmácia:'💊', Assistência:'🤝', 'Atenção Domiciliar':'🏠',
  Regulação:'📋', default:'📍'
};
const icon = t => ICONS[t] || ICONS.default;

/* ── STATE ─────────────────────────────────────────── */
let tab    = 'todos';
let filter = null;
let query  = '';

/* ── HELPERS ───────────────────────────────────────── */
const $ = id => document.getElementById(id);
const esc = s => s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';

function mapsUrl(e) {
  if (e.lat && e.lon)
    return `https://www.google.com/maps/dir/?api=1&destination=${e.lat},${e.lon}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((e.nome||'')+' '+(e.endereco||'')+' Peruíbe SP')}`;
}

function telDigits(t) { return t.replace(/\D/g,''); }

/* ── FILTER / SEARCH ──────────────────────────────── */
function getVisible() {
  return DATA.filter(e => {
    if (tab !== 'todos' && e.categoria !== tab) return false;
    if (filter && e.tipo !== filter) return false;
    if (query) {
      const hay = [e.nome, e.tipo, e.endereco, e.id].filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(query)) return false;
    }
    return true;
  }).sort((a,b) => (a.nome||'').localeCompare(b.nome||'','pt-BR'));
}

/* ── SET TAB ──────────────────────────────────────── */
function setTab(t) {
  tab    = t;
  filter = null;

  // bottom nav
  ['all','saude','edu'].forEach(k => {
    const map = {all:'todos', saude:'saude', edu:'educacao'};
    const active = map[k] === t ? `active-${k === 'all' ? 'todos' : k}` : '';
    $(`nav-${k}`).className = `nav-btn ${active}`.trim();
    $(`nav-${k}`).setAttribute('aria-selected', map[k] === t);
  });
  // desktop tabs
  ['all','saude','edu'].forEach(k => {
    const map = {all:'todos', saude:'saude', edu:'educacao'};
    const active = map[k] === t ? `active-${k === 'all' ? 'todos' : k}` : '';
    $(`dtab-${k}`).className = `dtab ${active}`.trim();
    $(`dtab-${k}`).setAttribute('aria-selected', map[k] === t);
  });

  buildChips();
  render();
}

/* ── SEARCH ───────────────────────────────────────── */
function onSearch() {
  query = $('search').value.toLowerCase().trim();
  render();
}
function clearSearch() {
  $('search').value = '';
  query = '';
  render();
  $('search').focus();
}

/* ── CLEAR ALL ─────────────────────────────────────── */
function clearAll() {
  filter = null;
  query  = '';
  $('search').value = '';
  buildChips();
  render();
}

/* ── BUILD CHIPS ──────────────────────────────────── */
function buildChips() {
  const pool = DATA.filter(e => tab === 'todos' || e.categoria === tab);
  const tipos = [...new Set(pool.map(e => e.tipo).filter(Boolean))].sort();
  const wrap = $('filter-chips');
  wrap.innerHTML = '';

  tipos.forEach(t => {
    const cat  = pool.find(e => e.tipo === t)?.categoria || 'saude';
    const cls  = `chip chip-${cat === 'saude' ? 'saude' : 'edu'}${filter === t ? ' active' : ''}`;
    const btn  = document.createElement('button');
    btn.className = cls;
    btn.setAttribute('aria-pressed', filter === t);
    btn.setAttribute('aria-label', `Filtrar por ${t}`);
    btn.innerHTML = `<span aria-hidden="true">${icon(t)}</span> ${esc(t)}`;
    btn.addEventListener('click', () => {
      filter = filter === t ? null : t;
      buildChips();
      render();
    });
    wrap.appendChild(btn);
  });
}

/* ── RENDER CARDS ─────────────────────────────────── */
function render() {
  const items = getVisible();
  const total = items.length;
  const grid  = $('grid');

  // counts
  const nSaude = DATA.filter(e => e.categoria==='saude').length;
  const nEdu   = DATA.filter(e => e.categoria==='educacao').length;
  $('count-saude').textContent = nSaude;
  $('count-edu').textContent   = nEdu;
  $('nc-all').textContent   = DATA.length;
  $('nc-saude').textContent = nSaude;
  $('nc-edu').textContent   = nEdu;
  $('dc-all').textContent   = DATA.length;
  $('dc-saude').textContent = nSaude;
  $('dc-edu').textContent   = nEdu;

  // results bar
  $('results-count').textContent = `${total} equipamento${total!==1?'s':''}`;
  const hasFilters = filter || query;
  $('clear-all-btn').className = `clear-btn${hasFilters ? ' visible' : ''}`;

  // empty
  if (total === 0) {
    grid.innerHTML = `
      <div class="empty" role="status">
        <div class="empty-emoji">🔍</div>
        <div class="empty-title">Nenhum resultado</div>
        <div class="empty-sub">Tente outros termos ou limpe os filtros aplicados.</div>
      </div>`;
    return;
  }

  // cards
  const frag = document.createDocumentFragment();
  items.forEach(e => {
    const isSaude = e.categoria === 'saude';
    const cls = isSaude ? 'cat-saude' : 'cat-edu';
    const tels = [e.tel1, e.tel2].filter(Boolean);
    const emails = [e.email1, e.email2].filter(Boolean);

    let body = '';
    if (e.endereco) body += infoRow('📍', esc(e.endereco));
    if (tels.length) body += infoRow('📞', tels.map(t =>
      `<a href="tel:${telDigits(t)}" aria-label="Ligar para ${esc(t)}">${esc(t)}</a>`
    ).join(' &nbsp;/&nbsp; '));
    if (emails.length) body += infoRow('✉️', emails.map(m =>
      `<a href="mailto:${esc(m)}">${esc(m)}</a>`
    ).join('<br>'));

    const card = document.createElement('article');
    card.className = `card ${cls}`;
    card.setAttribute('aria-label', e.nome || 'Equipamento');
    card.innerHTML = `
      <div class="card-head">
        <div class="card-icon-box" aria-hidden="true">${icon(e.tipo)}</div>
        <div class="card-title-wrap">
          <div class="card-name">${esc(e.nome || 'Sem nome')}</div>
          <span class="card-badge">${esc(e.tipo || '')}</span>
        </div>
      </div>
      <div class="card-body">${body || '<div class="info-row" style="color:var(--muted)">Sem dados adicionais</div>'}</div>
      <div class="card-foot">
        <a class="btn-maps"
           href="${mapsUrl(e)}"
           target="_blank"
           rel="noopener noreferrer"
           aria-label="Abrir ${esc(e.nome)} no Google Maps">
          <span class="btn-maps-icon" aria-hidden="true">🗺️</span>
          Ir até lá – Google Maps
        </a>
      </div>`;
    frag.appendChild(card);
  });

  grid.innerHTML = '';
  grid.appendChild(frag);
}

function infoRow(ic, content) {
  return `<div class="info-row"><span class="info-icon" aria-hidden="true">${ic}</span><span class="info-text">${content}</span></div>`;
}

/* ── INIT ─────────────────────────────────────────── */
buildChips();
render();
</script>
